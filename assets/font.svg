<svg viewBox="0 0 500 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="500" height="200" fill="#ffffff"/>
  
  <!-- Main text: EST -->
  <text x="250" y="100" font-family="Arial, sans-serif" font-size="72" font-weight="bold" text-anchor="middle" fill="#1f2937">
    EST
  </text>
  
  <!-- Subtitle: student -->
  <text x="250" y="145" font-family="Arial, sans-serif" font-size="24" text-anchor="middle" fill="#6b7280" letter-spacing="2">
    student
  </text>
  
  <!-- Subtle bottom line -->
  <line x1="100" y1="165" x2="400" y2="165" stroke="#d1d5db" stroke-width="1"/>
</svg>